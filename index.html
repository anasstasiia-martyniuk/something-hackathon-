<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our beautiful idea</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="navbar-name">Choose for me!</div>
        <div class="navbar-links">
          <a href="#yes-no-section">Yes/No</a>
          <a href="#wheel-section">Wheel</a>
        </div>
      </nav>
    </header>

    <main>
      <!-- Hero -->
      <section></section>

      <!-- Yes or No -->
      <section id="yes-no-section">
        <!-- We use app-container to keep the dark theme box styling consistent -->
        <div class="app-container center-content">
          <h2 class="section-title">Ask a Yes or No Question</h2>
          <div class="input-group width-limit">
            <input type="text" id="yn-input" placeholder="Should I order pizza tonight?" />
            <button id="yn-btn">Ask!</button>
          </div>
          <p id="yn-result"></p>
        </div>
      </section>

      <!-- Wheel -->
      <section id="wheel-section">
        <div class="app-container">
          
          <!-- Left side: The Wheel -->
          <div class="wheel-section-inner">
            <div class="wheel-container">
              <div class="pointer"></div>
              <div class="wheel" id="wheel"></div>
            </div>
            <button id="spin-btn">Spin the Wheel</button>
            <p id="result"></p>
          </div>

          <!-- Right side: The Options List -->
          <div class="list-section">
            <h2>Wheel Options</h2>
            <div class="input-group">
              <input type="text" id="new-option" placeholder="Enter an option..." />
              <button id="add-btn">Add</button>
            </div>
            <ul id="options-list"></ul>
          </div>

        </div>
      </section>
    </main>

    <footer></footer>
  </body>

  <script>
      // ==========================================
      // WHEEL LOGIC
      // ==========================================
      const wheel = document.getElementById("wheel");
      const spinBtn = document.getElementById("spin-btn");
      const resultDisplay = document.getElementById("result");
      
      const optionInput = document.getElementById("new-option");
      const addBtn = document.getElementById("add-btn");
      const optionsList = document.getElementById("options-list");

      // Default options and a color palette
      let options = ["Pizza", "Burgers", "Tacos", "Sushi", "Salad"];
      const colors = ["#f43f5e", "#f97316", "#eab308", "#22c55e", "#3b82f6", "#a855f7", "#ec4899", "#14b8a6"];

      let currentRotation = 0;
      let isSpinning = false;

      // Initialize app
      function init() {
        renderList();
        renderWheel();
      }

      // 1. Render the List UI
      function renderList() {
        optionsList.innerHTML = "";
        options.forEach((option, index) => {
          const li = document.createElement("li");
          
          const textSpan = document.createElement("span");
          textSpan.textContent = option;
          
          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "X";
          deleteBtn.classList.add("delete-btn");
          deleteBtn.onclick = () => removeOption(index);

          li.appendChild(textSpan);
          li.appendChild(deleteBtn);
          optionsList.appendChild(li);
        });
      }

      // 2. Render the Wheel with dynamic slices and text
      function renderWheel() {
        if (options.length === 0) {
          wheel.style.background = "#ccc";
          wheel.innerHTML = "";
          return;
        }

        const sliceDegree = 360 / options.length;
        let gradientParts = [];
        wheel.innerHTML = ""; // Clear existing text elements

        options.forEach((option, index) => {
          const color = colors[index % colors.length];
          const startAngle = index * sliceDegree;
          const endAngle = startAngle + sliceDegree;
          
          gradientParts.push(`${color} ${startAngle}deg ${endAngle}deg`);

          const label = document.createElement("div");
          label.classList.add("wheel-label");
          label.textContent = option;

          const textRotation = startAngle + (sliceDegree / 2) - 90;
          label.style.transform = `rotate(${textRotation}deg) translateY(-50%)`;
          
          wheel.appendChild(label);
        });

        wheel.style.background = `conic-gradient(${gradientParts.join(", ")})`;
      }

      // 3. Add new option
      function addOption() {
        const value = optionInput.value.trim();
        if (value === "") return;
        
        options.push(value);
        optionInput.value = ""; 
        
        currentRotation = 0;
        wheel.style.transition = "none";
        wheel.style.transform = `rotate(0deg)`;
        setTimeout(() => wheel.style.transition = "transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)", 50);

        renderList();
        renderWheel();
      }

      // 4. Remove an option
      function removeOption(index) {
        if (isSpinning) return; 
        options.splice(index, 1);
        
        currentRotation = 0;
        wheel.style.transition = "none";
        wheel.style.transform = `rotate(0deg)`;
        setTimeout(() => wheel.style.transition = "transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)", 50);

        renderList();
        renderWheel();
      }

      // 5. Spin logic
      spinBtn.addEventListener("click", () => {
        if (isSpinning || options.length === 0) return;

        isSpinning = true;
        resultDisplay.textContent = "Spinning...";

        const randomSpin = Math.floor(Math.random() * 360) + 1800; 
        currentRotation += randomSpin;
        wheel.style.transform = `rotate(${currentRotation}deg)`;
      });

      wheel.addEventListener("transitionend", () => {
        if (!isSpinning) return;
        isSpinning = false;

        if (options.length === 0) return;

        const sliceDegree = 360 / options.length;
        const actualDegrees = currentRotation % 360;
        
        const pointerDegree = (360 - actualDegrees) % 360;
        const winningIndex = Math.floor(pointerDegree / sliceDegree);

        resultDisplay.textContent = `You won: ${options[winningIndex]}!`;
      });

      optionInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") addOption();
      });

      addBtn.addEventListener("click", addOption);

      init();

      // ==========================================
      // YES OR NO LOGIC
      // ==========================================
      const ynInput = document.getElementById("yn-input");
      const ynBtn = document.getElementById("yn-btn");
      const ynResult = document.getElementById("yn-result");

      function askYesNo() {
        const question = ynInput.value.trim();
        
        if (question === "") {
          ynResult.textContent = "Please type a question first!";
          ynResult.style.color = "#ffffff";
          return;
        }

        // Show thinking animation
        ynResult.textContent = "Thinking...";
        ynResult.style.color = "#ffffff";

        // Wait half a second for dramatic effect, then pick Yes or No
        setTimeout(() => {
          const isYes = Math.random() >= 0.5; // 50% chance 
          
          if (isYes) {
            ynResult.textContent = "YES";
            ynResult.style.color = "#22c55e"; // Green
          } else {
            ynResult.textContent = "NO";
            ynResult.style.color = "#ef4444"; // Red
          }
        }, 500);
      }

      ynBtn.addEventListener("click", askYesNo);
      
      // Let user press Enter to ask
      ynInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") askYesNo();
      });
  </script>
</html>
